name: News (alle 2 Stunden)

on:
  schedule:
    # Zwischen etwa 06:00 und 23:00 Uhr Schweizer Zeit, alle 2 Stunden.
    - cron: '20 4-22/2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit          # gleiche Gruppe wie das tägliche Update: nie zwei Commits gleichzeitig
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RSS-Feeds abrufen
        run: node scripts/news.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "pitwall-bot"
          git config user.email "pitwall-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Keine neuen Meldungen."
          else
            git commit -m "News $(TZ=Europe/Zurich date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
