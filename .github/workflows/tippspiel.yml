name: Tippspiel-Sync

# Überträgt Kalender und Fahrerfeld nach Supabase (stündlich) und prüft
# Resultate alle 10 Minuten – innerhalb von 3 Stunden nach einer Session
# (Quali/Sprint/Rennen) wertet das Skript sie dann auch wirklich aus, sonst
# bleibt es beim Stundentakt. Ohne die Secrets SUPABASE_URL und
# SUPABASE_SERVICE_KEY beendet sich der Job einfach.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tippspiel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kalender und Fahrer übertragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/tippspiel.mjs
