name: Tägliches Update (06:00 Uhr Schweiz)

on:
  schedule:
    # 04:00 UTC = 06:00 Sommerzeit, 05:00 UTC = 06:00 Winterzeit.
    # Das Script prüft selbst, ob es in Zürich gerade 6 Uhr ist.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # manuell starten: Actions -> "Tägliches Update" -> Run workflow

permissions:
  contents: write

concurrency:
  group: data-commit          # gleiche Gruppe wie der News-Abruf: nie zwei Commits gleichzeitig
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Daten aktualisieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/update.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "pitwall-bot"
          git config user.email "pitwall-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten-Update $(TZ=Europe/Zurich date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
